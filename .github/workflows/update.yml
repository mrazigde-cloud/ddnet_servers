name: Update DDNet Servers

on:
  schedule:
    # Запуск каждые 15 минут
    - cron: '*/15 * * * *'
  # Позволяет запускать скрипт вручную кнопкой на вкладке Actions
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка библиотек
        run: pip install requests beautifulsoup4

      - name: Запуск парсера
        run: python update.py

      - name: Сохранение изменений в README
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Обновление списка серверов" && git push)
